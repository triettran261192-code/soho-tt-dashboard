# Đăng dashboard lên GitHub Pages mỗi khi index.html thay đổi.
# Kho này CÔNG KHAI và chỉ chứa trang dashboard + sổ MẪU. Sổ thật nằm ở kho riêng tư soho-tt.
name: Đăng dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: dang
        uses: actions/deploy-pages@v4
